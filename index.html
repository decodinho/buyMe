<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    
  <title>Application React 2025</title>
  <link rel="stylesheet" href="styleCat.css" />
  <link rel="stylesheet" href="styleBasketBtn.css" />
  <!-- Chargement des scripts (Ordre critique) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="countViews.JS"></script>
</head>
<body>
  <div id="root">Chargement...</div>

  <script type="text/babel">
   
    // 1. EXTRACTION DES HOOKS (Ne pas utiliser 'import' ici)
    const { useState, useEffect } = React;

    // 2. COMPOSANT ENFANT (Manquant dans votre code)
    function ListeProduits({ produits }) {
  // Sécurité indispensable : si produits n'est pas encore un tableau, on affiche un message
  if (!Array.isArray(produits)) {
    return <p>Chargement des articles...</p>;
  }

  return (
    <ul>
      {produits.map((produit, index) => (
        <div 
          key={produit.productID || index}
          onClick={() => countViews(produit.productID)} 
          style={{ cursor: 'pointer', marginBottom: '15px' }}
        >
          <li>
            <strong>{produit.detailArticle || "Article sans detail"}</strong>
            <br/>
            {produit.descrArticle || " "}
          </li>
          {/* Affichage du nombre de vues */}
          <small>{produit.vues || 0} <em>vues</em></small>
          <br/>
          {/* Correction : 'className' au lieu de 'class' pour React */}
          <button className="btn-add-to-cart">
            Ajouter au panier
          </button>
          <p>-----------------------------------</p>
        </div>
      ))}
    </ul>
  );
}


    function App() {
      const [choix, setChoix] = useState("voiture");
      const [produits, setProduits] = useState([]);
      
      useEffect(() => {
        // CORRECTION : Utilisation des backticks (`) et du symbole $ pour l'URL dynamique
        //	https://l1upgx0w59.execute-api.us-east-1.amazonaws.com/dev
        fetch(`https://l1upgx0w59.execute-api.us-east-1.amazonaws.com/dev/readArticles?category=${choix}`)
          .then(res => res.json())
          .then(const listeVerifiee = typeof data === 'string' ? JSON.parse(data) : data;setProduits(listeVerifiee);)
          .catch(err => console.error("Erreur API:", err));
      }, [choix]);
    
      return (
        <div >
          <button class="category" onClick={() => setChoix("voiture")}>
            <figure>
              <img src="voiture1.png" alt="Voitures" width="120" />
              <figcaption>Voitures</figcaption>
            </figure>
          </button>

          <button class="category" onClick={() => setChoix("sac")}>
            <figure>
              <img src="sac2.png" alt="Cartables" width="120" />
              <figcaption>Cartables</figcaption>
            </figure>
          </button>

          <button class="category" onClick={() => setChoix("laptop")}>
            <figure>
              <img src="laptop1.png" alt="Laptops" width="120" />
              <figcaption>Laptops</figcaption>
            </figure>
          </button>

           <button class="category" onClick={() => setChoix("laptop")}>
            <figure>
              <img src="basket1.png" alt="baskets" width="120" />
              <figcaption>baskets</figcaption>
            </figure>
          </button>

           <button class="category" onClick={() => setChoix("laptop")}>
            <figure>
              <img src="basket2.png" alt="Laptops" width="120" />
              <figcaption>Chaussures Dames</figcaption>
            </figure>
          </button>

           <button class="category" onClick={() => setChoix("laptop")}>
            <figure>
              <img src="electroMen.png" alt="Electro-Menager" width="120" />
              <figcaption>Electro-menager</figcaption>
            </figure>
          </button>

          <button class="category" onClick={() => setChoix("laptop")}>
            <figure>
              <img src="films.png" alt="films" width="120" />
              <figcaption>films</figcaption>
            </figure>
          </button>

          <button class="category" onClick={() => setChoix("laptop")}>
            <figure>
              <img src="gaming.png" alt="Jeux videos" width="120" />
              <figcaption>Jeux videos</figcaption>
            </figure>
          </button>
    
          <button class="category" onClick={() => setChoix("phones")}>
            <figure>
              <img src="tel1.png" alt="Téléphones" width="120" />
              <figcaption>Phones</figcaption>
            </figure>
          </button><br/><br/>
          
          <div>
          <h1>Rayon actuel : {choix}</h1>
          <ListeProduits produits={produits} />
          </div>
        </div>
      );
    }
    
    // 3. RENDU FINAL (Utilisation correcte de ReactDOM)
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
   <a href="connexion.html" title="Visiter le site" target="_blank" rel="noopener">Connexion</a>
</body>
</html>
