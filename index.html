<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Application React 2026</title>
  <link rel="stylesheet" href="styleCat.css" />
  <link rel="stylesheet" href="styleBasketBtn.css" />
  <link rel="stylesheet" href="styleIndex.css" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="countViews.JS"></script>
  <script src="reduction.js"></script>
  <script src="sentToCart.js"></script> 
</head>
<body>
  <div id="root">Chargement...</div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;
    /* Copie ce bloc juste au-dessus de function ListeProduits */
    function Stars({ note }) {
      const n = Number(note) || 0;
      const etoiles = [1, 2, 3, 4, 5];
    
      return (
        <div style={{ display: 'inline-flex', color: '#FF9900', marginRight: '8px' }}>
          {etoiles.map((i) => (
            <span key={i} style={{ color: i <= n ? "#FF9900" : "#ccc" }}>
              ★
            </span>
          ))}
        </div>
      );
    }


    function ListeProduits({ produits }) {
      let listeArticles = produits;
      
      if (typeof produits === 'string') {
        try {
          listeArticles = JSON.parse(produits);
        } catch (e) {
          console.error("Erreur de parsing JSON", e);
          listeArticles = [];
        }
      }
    
      if (!Array.isArray(listeArticles) || listeArticles.length === 0) {
        return <p>Chargement des produits ou aucun produit trouvé...</p>;
      }
    
      return (
        <ul className="purple-amazon-list">
          {listeArticles.map((p, index) => (
            <li className="purple-item" key={p.productID || index}>
              <div className="image-container" onClick={() => countViews(p.productID, p.category)}>
                <img src={p.image} alt={p.detailArticle}/>
              </div>
        
              <div className="info-container">
                <strong className="product-title" onClick={() => countViews(p.productID, p.category)}>
                  {p.detailArticle || "Sans titre"}
                </strong>

                <div className="old-price-wrapper">
                  <s className="text-muted">{p.prix}$</s>
                </div>
                <h3>{reduction(p.prix, p.reduction)}$</h3>
                <p style={{ color: 'green', fontWeight: 'bold' }}>
                  Economisez jusqu'à {p.reduction} % !!
                </p>
                <span className="clignotement">OFFRE LIMITÉE !</span>
                
                <div className="rating">
                        {/* On passe la note. Si elle est absente (undefined), on envoie 0 */}
                        <Stars note={p.note || 0} />
                        
                        {/* Affichage du chiffre à côté des étoiles pour vérification */}
                        <strong style={{ marginLeft: '5px', color: '#666' }}>
                          {p.note ? p.note : "N/A"}
                        </strong>
                      
                        <em className="views-badge" style={{ marginLeft: '10px' }}>
                          {p.vues || 0} vues
                        </em>
                  </div>
        
                <p className="description">{p.descrArticle || "Article sans detail"}</p>
                
               <button onClick={() => window.sentToCart(p)} className="purple-cart-btn">Ajouter au panier</button>
              </div>
            </li>
          ))}
        </ul>
      );
    }

    function App() {
      const [choix, setChoix] = useState("voiture");
      const [produits, setProduits] = useState([]);

      useEffect(() => {
        fetch(`https://l1upgx0w59.execute-api.us-east-1.amazonaws.com/dev/readArticles?category=${choix}`)
          .then(res => res.json())
          .then(data => {
            let articlesVrais = typeof data === 'string' ? JSON.parse(data) : data;
            if (articlesVrais && !Array.isArray(articlesVrais)) {
              articlesVrais = [articlesVrais];
            }
            setProduits(articlesVrais);
          })
          .catch(err => console.error("Erreur :", err));
      }, [choix]);

      return (
        <div>
          <nav className="nav-bar">
            <button className="category" onClick={() => setChoix("voiture")}>
              <figure><img src="voiture1.png" alt="Voitures" width="120" /><figcaption>Voitures</figcaption></figure>
            </button>
      
            <button className="category" onClick={() => setChoix("sac")}>
              <figure><img src="sac2.png" alt="Sacs" width="120" /><figcaption>Sacs</figcaption></figure>
            </button>
      
            <button className="category" onClick={() => setChoix("laptop")}>
              <figure><img src="laptop1.png" alt="Laptops" width="120" /><figcaption>Laptops</figcaption></figure>
            </button>
      
            <button className="category" onClick={() => setChoix("basket")}>
              <figure><img src="basket1.png" alt="Baskets" width="120" /><figcaption>Baskets</figcaption></figure>
            </button>
      
            <button className="category" onClick={() => setChoix("films")}>
              <figure><img src="films.png" alt="Films" width="120" /><figcaption>Films</figcaption></figure>
            </button>
      
            <button className="category" onClick={() => setChoix("phones")}>
              <figure><img src="tel1.png" alt="Téléphones" width="120" /><figcaption>Phones</figcaption></figure>
            </button>
      
            <div className="search-container">
              <input className="search-input" type="text" placeholder="Rechercher un produit..." />
              <button className="search-button">🔍</button>
            </div>

            {/* Correction du commentaire ici : Bouton Connexion */}
            <div className="action-box" onClick={() => window.location.href='connexion.html'}>
                <button className="btn-login">Connexion</button>  
            </div>
          </nav>
          
           <div className="amazon-cart-wrapper" onClick={() => window.location.href='PanierBasket.html'}>
                    <div className="cart-icon-container">
                        <span id="cart-count">0</span>
                        <img src="6011.jpg" alt="Panier" width="18" height="23"/>
                    </div>
                    <span className="cart-text">Panier</span>
            </div>
          
          <div style={{ padding: '20px' }}>
            <h1>Rayon actuel : {choix}</h1>
            <ListeProduits produits={produits} />
          </div>
          
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
  <script src="createCredential.js"></script>
</body>
</html>
