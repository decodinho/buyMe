<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    
  <title>Application React 2025</title>
  <link rel="stylesheet" href="styleCat.css" />
  <link rel="stylesheet" href="styleBasketBtn.css" />
  <!-- Chargement des scripts (Ordre critique) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="countViews.JS"></script>
</head>
<body>
  <div id="root">Chargement...</div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function ListeProduits({ produits }) {
      // Sécurité 2026 : On s'assure que produits est un tableau exploitable
      const listeArticles = Array.isArray(produits) ? produits : [];
      
      if (listeArticles.length === 0) return <p>Aucun produit trouvé ou chargement...</p>;

      return (
        <ul>
          {listeArticles.map((produit, index) => (
            <div key={produit.productID || index} style={{ marginBottom: "20px" }}>
              <li>
                <strong>{produit.detailArticle || "Article"}</strong>
                <br/>
                {produit.descrArticle || ""}
              </li>
              <small>{produit.vues || 0} vues</small>
              <br/>
              <button className="btn-add-to-cart">Ajouter au panier</button>
              <p>-----------------------------------</p>
            </div>
          ))}
        </ul>
      );
    }

    function App() {
      const [choix, setChoix] = useState("voiture");
      const [produits, setProduits] = useState([]);
      
      useEffect(() => {
        fetch(`https://l1upgx0w59.execute-api.us-east-1.amazonaws.com/dev/readArticles?category=${choix}`)
          .then(res => res.json())
          .then(data => {
            // CORRECTION CRUCIALE : Si data est une String (à cause du json.dumps Lambda), on la parse
            const finalData = typeof data === "string" ? JSON.parse(data) : data;
            setProduits(finalData);
          })
          .catch(err => console.error("Erreur API:", err));
      }, [choix]);
    
      return (
        <div>
          {/* Correction : Chaque bouton doit mettre à jour sa catégorie spécifique */}
          <button className="category" onClick={() => setChoix("voiture")}>
            <figure><img src="voiture1.png" width="120" /><figcaption>Voitures</figcaption></figure>
          </button>
          <button className="category" onClick={() => setChoix("sac")}>
            <figure><img src="sac2.png" width="120" /><figcaption>Sacs</figcaption></figure>
          </button>
          <button className="category" onClick={() => setChoix("laptop")}>
            <figure><img src="laptop1.png" width="120" /><figcaption>Laptops</figcaption></figure>
          </button>
          <button className="category" onClick={() => setChoix("basket")}>
            <figure><img src="basket1.png" width="120" /><figcaption>Baskets</figcaption></figure>
          </button>
          <button className="category" onClick={() => setChoix("films")}>
            <figure><img src="films.png" width="120" /><figcaption>Films</figcaption></figure>
          </button>
          <button className="category" onClick={() => setChoix("phones")}>
            <figure><img src="tel1.png" width="120" /><figcaption>Phones</figcaption></figure>
          </button>
          
          <br/><br/>
          <div>
            <h1>Rayon actuel : {choix}</h1>
            <ListeProduits produits={produits} />
          </div>
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
</script>

   <a href="connexion.html" title="Visiter le site" target="_blank" rel="noopener">Connexion</a>
</body>
</html>
