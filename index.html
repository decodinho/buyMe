<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    
  <title>Application React 2025</title>
  <link rel="stylesheet" href="styleCat.css" />
  <link rel="stylesheet" href="styleBasketBtn.css" />
  <!-- Chargement des scripts (Ordre critique) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="countViews.JS"></script>
</head>
<body>
  <div id="root">Chargement...</div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Composant pour afficher la liste des articles
    function ListeProduits({ produits }) {
      // Si produits est une chaîne ou vide, on sécurise
      const listeVerifiee = Array.isArray(produits) ? produits : [];

      if (listeVerifiee.length === 0) {
        return <p style={{color: "gray"}}>Aucun produit trouvé pour cette catégorie.</p>;
      }

      return (
        <ul style={{ listStyle: "none", padding: 0 }}>
          {listeVerifiee.map((produit, index) => (
            <div 
              key={produit.productID || index} 
              style={{ 
                borderBottom: "1px solid #ccc", 
                padding: "15px", 
                cursor: "pointer" 
              }}
              onClick={() => typeof countViews === 'function' && countViews(produit.productID)}>
              <li>
                <strong style={{ fontSize: "1.2em" }}>{produit.detailArticle || "Article"}</strong>
                <br/>
                <span style={{ color: "#555" }}>{produit.descrArticle || "Pas de description"}</span>
              </li>
              <div style={{ marginTop: "10px" }}>
                <small>🔥 {produit.vues || 0} vues</small>
              </div>
              <button className="btn-add-to-cart" style={{ marginTop: "10px" }}>
                Ajouter au panier
              </button>
            </div>
          ))}
        </ul>
      );
    }

    function App() {
      const [choix, setChoix] = useState("voiture");
      const [produits, setProduits] = useState([]);
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        setLoading(true);
        fetch(`l1upgx0w59.execute-api.us-east-1.amazonaws.com{choix}`)
          .then(res => res.json())
          .then(data => {
            // OPTION 1 : Décodage manuel si la Lambda renvoie du texte (JSON String)
            // Si data est une string, on la parse, sinon on garde l'objet
            const finalData = typeof data === "string" ? JSON.parse(data) : data;
            
            console.log("Données reçues et décodées :", finalData);
            setProduits(finalData);
            setLoading(false);
          })
          .catch(err => {
            console.error("Erreur API:", err);
            setLoading(false);
          });
      }, [choix]);

      // Fonction utilitaire pour créer les boutons de catégorie
      const renderBtn = (cat, label, imgSrc) => (
        <button className="category" onClick={() => setChoix(cat)} style={{ margin: "5px" }}>
          <figure>
            <img src={imgSrc} alt={label} width="80" />
            <figcaption>{label}</figcaption>
          </figure>
        </button>
      );

      return (
        <div>
          <nav>
            {renderBtn("voiture", "Voitures", "voiture1.png")}
            {renderBtn("sac", "Sacs", "sac2.png")}
            {renderBtn("laptop", "Laptops", "laptop1.png")}
            {renderBtn("basket", "Baskets", "basket1.png")}
            {renderBtn("films", "Films", "films.png")}
            {renderBtn("phones", "Phones", "tel1.png")}
          </nav>
          
          <hr/>
          
          <section>
            <h1>Rayon : <span style={{color: "blue"}}>{choix.toUpperCase()}</span></h1>
            {loading ? <p>Chargement en cours...</p> : <ListeProduits produits={produits} />}
          </section>
        </div>
      );
    }

    // Rendu final
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
</script>

   <a href="connexion.html" title="Visiter le site" target="_blank" rel="noopener">Connexion</a>
</body>
</html>
