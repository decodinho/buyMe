<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Application React 2025</title>
  <link rel="stylesheet" href="styleCat.css" />
  <link rel="stylesheet" href="styleBasketBtn.css" />
  
  <script src="unpkg.com"></script>
  <script src="unpkg.com"></script>
  <script src="cdnjs.cloudflare.com"></script>
  <script src="unpkg.com"></script>
</head>
<body>
  <div id="root">Chargement du catalogue...</div>

  <script type="text/babel">
    // 1. Initialisation sécurisée
    const initAmplify = () => {
      try {
        if (window.aws_amplify) {
          const { Amplify } = window.aws_amplify;
          Amplify.configure({
            Auth: {
              Cognito: {
                userPoolId: 'us-east-1_Y6RbSWAyM',
                userPoolClientId: '47fgl7u7e595ob3lj2u3uddqsv'
              }
            }
          });
          console.log("Amplify configuré avec succès");
        }
      } catch (e) {
        console.error("Erreur de configuration Amplify:", e);
      }
    };

    initAmplify();

    const { useState, useEffect } = React;

    function ListeProduits({ produits }) {
      const produitsArray = Array.isArray(produits) ? produits : Object.values(produits);
      
      return (
        <ul>
          {produitsArray.map((produit, index) => (
            <div key={produit.productID || index} className="product-item">
              <li>
                <strong>{produit.detailArticle || "Article"}</strong><br/>
                {produit.descrArticle || ""}
              </li>
              <button className="btn-add-to-cart">Ajouter au panier</button>
              <hr/>
            </div>
          ))}
        </ul>
      );
    }

    function App() {
      const [choix, setChoix] = useState("voiture");
      const [produits, setProduits] = useState([]);

      useEffect(() => {
        fetch(`l1upgx0w59.execute-api.us-east-1.amazonaws.com{choix}`)
          .then(res => res.json())
          .then(data => {
            const body = typeof data.body === 'string' ? JSON.parse(data.body) : data;
            setProduits(body);
          })
          .catch(err => console.error("Erreur API:", err));
      }, [choix]);

      return (
        <div>
          <nav>
            {["voiture", "sac", "laptop", "phones"].map(cat => (
              <button key={cat} className="category" onClick={() => setChoix(cat)}>
                <figure>
                  <img src={`${cat}1.png`} alt={cat} width="80" />
                  <figcaption>{cat}</figcaption>
                </figure>
              </button>
            ))}
          </nav>
          
          <h1>Rayon : {choix}</h1>
          <ListeProduits produits={produits} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>

  <div style="margin-top: 20px; padding: 10px; border-top: 1px solid #ccc;">
    <a href="connexion.html">Se connecter</a>
  </div>
</body>
</html>
