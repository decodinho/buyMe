<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styleConnexion.css" />

  <!-- ÉTAPE 1 : Chargement d'Amplify -->
  <script src="cdnjs.cloudflare.com"></script>
  <script src="connexion.js"></script>
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="login-title">
      <header class="card__header">
        <h1 id="login-title" class="card__title">Bienvenue</h1>
        <p class="card__subtitle">Connectez-vous pour accéder à votre panier</p>
      </header>

      <!-- ÉTAPE 2 : ID ajouté au formulaire pour le JS -->
      <form id="loginForm" class="form" novalidate>
        <div class="form__group">
          <label for="login" class="form__label">Identifiant</label>
          <input
            type="text"
            id="login"
            name="login"
            class="form__input"
            placeholder="ex. email@domaine.com"
            required
          />
        </div>

        <div class="form__group">
          <div class="form__label-row">
            <label for="password" class="form__label">Mot de passe</label>
            <a class="form__link" href="#">Mot de passe oublié ?</a>
          </div>
          <input
            type="password"
            id="password"
            name="password"
            class="form__input"
            placeholder="••••••••"
            required
          />
        </div>

        <div class="form__actions">
          <label class="checkbox">
            <input type="checkbox" name="remember" class="checkbox__input" />
            <span class="checkbox__label">Se souvenir de moi</span>
          </label>

          <button type="submit" id="submitBtn" class="btn btn--primary">
            Se connecter
          </button>
        </div>
      </form>

      <footer class="card__footer">
        <p class="card__alt">Nouveau ici ? <a class="form__link" href="#">Créer un compte</a></p>
      </footer>
    </section>
  </main>

  <script>
    // ÉTAPE 3 : Configuration
    const { Amplify, Auth } = window.aws_amplify;

    Amplify.configure({
      Auth: {
        Cognito: {
          userPoolId: 'us-east-1_Y6RbSWAyM',      // ex: us-east-1_xxxxxx
          userPoolClientId: '47fgl7u7e595ob3lj2u3uddqsv'    // ex: 7u9xxxxxxxxxxx
        }
      }
    });

    // ÉTAPE 4 : Logique de connexion
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault(); // Empêche le rechargement de la page
      
      const username = document.getElementById('login').value;
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Connexion...";

      try {
        const user = await Auth.signIn(username, password);
        console.log("Succès:", user);
        alert("Connexion réussie !");
        window.location.href = "index.html"; // Redirection vers l'accueil
      } catch (error) {
        console.error("Erreur Cognito:", error);
        alert("Erreur : " + (error.message || "Identifiants invalides"));
        submitBtn.disabled = false;
        submitBtn.textContent = "Se connecter";
      }
    });
  </script>
</body>
</html>
