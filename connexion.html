<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentification AWS - Amplify v6</title>
</head>
<body class="page">

    <div class="card">
        <div class="card__header">
            <h1 class="card__title" id="ui-title">Connexion</h1>
            <p class="card__subtitle" id="ui-subtitle">Accédez à votre espace sécurisé</p>
        </div>

        <div class="form">
            <!-- Email -->
            <div class="form__group">
                <label class="form__label">Email</label>
                <input type="email" id="auth-email" class="form__input" placeholder="nom@exemple.com">
            </div>

            <!-- Mot de passe -->
            <div class="form__group" id="group-password">
                <label class="form__label">Mot de passe</label>
                <input type="password" id="auth-password" class="form__input" placeholder="••••••••">
            </div>

            <!-- Code de vérification (caché par défaut) -->
            <div class="form__group" id="group-code" style="display: none;">
                <label class="form__label">Code de vérification</label>
                <input type="text" id="auth-code" class="form__input" placeholder="123456">
            </div>

            <button class="btn btn--primary" id="btn-auth">Continuer</button>
        </div>

        <div class="card__footer">
            <p class="card__alt" id="ui-toggle-wrapper">
                <span id="toggle-text">Pas encore de compte ?</span>
                <a class="form__link" id="link-toggle" href="#">S'inscrire</a>
            </p>
        </div>
    </div>

    <!-- LOGIQUE AMPLIFY V6 VIA UNPKG (FIX CORS) -->
    <script type="module">
        // Importation directe des fichiers ESM pour éviter les erreurs 404/CORS
        import { Amplify } from 'https://unpkg.com';
        import { 
            signIn, 
            signUp, 
            confirmSignUp, 
            signOut, 
            getCurrentUser 
        } from 'https://unpkg.com';

        // 1. CONFIGURATION (Remplacez par vos vrais IDs)
        Amplify.configure({
            Auth: {
                Cognito: {
                    userPoolId: 'VOTRE_USER_POOL_ID',
                    userPoolClientId: 'VOTRE_CLIENT_ID'
                }
            }
        });

        let currentMode = 'LOGIN';

        const uiTitle = document.getElementById('ui-title');
        const uiSubtitle = document.getElementById('ui-subtitle');
        const btnAuth = document.getElementById('btn-auth');
        const linkToggle = document.getElementById('link-toggle');
        const toggleText = document.getElementById('toggle-text');
        const groupPass = document.getElementById('group-password');
        const groupCode = document.getElementById('group-code');

        // 2. MISE À JOUR DE L'INTERFACE
        const updateUI = () => {
            if (currentMode === 'LOGIN') {
                uiTitle.innerText = "Connexion";
                uiSubtitle.innerText = "Heureux de vous revoir";
                btnAuth.innerText = "Se connecter";
                toggleText.innerText = "Pas encore de compte ?";
                linkToggle.innerText = "S'inscrire";
                groupPass.style.display = 'block';
                groupCode.style.display = 'none';
            } else if (currentMode === 'REGISTER') {
                uiTitle.innerText = "Créer un compte";
                uiSubtitle.innerText = "Rejoignez l'aventure";
                btnAuth.innerText = "S'inscrire";
                toggleText.innerText = "Déjà inscrit ?";
                linkToggle.innerText = "Se connecter";
                groupPass.style.display = 'block';
                groupCode.style.display = 'none';
            } else if (currentMode === 'VERIFY') {
                uiTitle.innerText = "Vérification";
                uiSubtitle.innerText = "Code envoyé par e-mail";
                btnAuth.innerText = "Confirmer le compte";
                groupPass.style.display = 'none';
                groupCode.style.display = 'block';
            }
        };

        linkToggle.onclick = (e) => {
            e.preventDefault();
            currentMode = (currentMode === 'LOGIN') ? 'REGISTER' : 'LOGIN';
            updateUI();
        };

        // 3. ACTIONS AUTHENTIFICATION
        btnAuth.onclick = async () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const code = document.getElementById('auth-code').value;

            try {
                if (currentMode === 'LOGIN') {
                    await signIn({ username: email, password });
                    alert("Connecté !");
                    window.location.reload();
                } 
                else if (currentMode === 'REGISTER') {
                    await signUp({ username: email, password });
                    currentMode = 'VERIFY';
                    updateUI();
                } 
                else if (currentMode === 'VERIFY') {
                    await confirmSignUp({ username: email, confirmationCode: code });
                    alert("Email vérifié ! Vous pouvez vous connecter.");
                    currentMode = 'LOGIN';
                    updateUI();
                }
            } catch (err) {
                console.error(err);
                alert("Erreur : " + err.message);
            }
        };

        // 4. PERSISTANCE ET DECONNEXION
        window.handleSignOut = async () => {
            await signOut();
            window.location.reload();
        };

        window.onload = async () => {
            try {
                const user = await getCurrentUser();
                uiTitle.innerText = "Bienvenue";
                uiSubtitle.innerText = user.username;
                document.querySelector('.form').innerHTML = `
                    <button class="btn btn--primary" onclick="handleSignOut()">Déconnexion</button>
                `;
                document.getElementById('ui-toggle-wrapper').style.display = 'none';
            } catch (e) {
                updateUI();
            }
        };

        // Exposer la fonction de déconnexion au scope global
        window.signOut = signOut;
    </script>
</body>
</html>
